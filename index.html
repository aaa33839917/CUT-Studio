<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUT 工作室</title>
<meta name="description" content="CUT 工作室 —— Minecraft Java 版与基岩版服务器">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #12161f; color: #eef2f9;
    font: 16px/1.8 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  }
  .box { width: min(90vw, 560px); text-align: center; padding: 40px 0; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 26px; border-radius: 18px;
    background: #1f2735; border: 1px solid rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; letter-spacing: .06em;
  }
  h1 { font-size: clamp(30px, 7vw, 46px); margin: 0 0 10px; letter-spacing: .1em; }
  .sub { color: #93a3bd; font-size: 15px; letter-spacing: .04em; margin-bottom: 30px; }
  .rule { height: 1px; background: rgba(255,255,255,.12); margin: 30px 0; }
  p { color: #b9c6da; margin: 0 0 12px; }
  .dim { color: #6f7f96; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">CUT</div>
    <h1>CUT 工作室</h1>
    <div class="sub">Minecraft Java 版 · 基岩版服务器</div>
    <div class="rule"></div>
    <p>网站正在建设中。</p>
    <p class="dim">Studio site under construction.</p>
  </div>
</body>
</html>
